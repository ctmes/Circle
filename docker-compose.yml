name: circle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circle
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: circle
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circle -d circle"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible private object storage. Stands in for Cloudflare R2 in dev;
  # the app talks to it through the standard S3 driver, so production is a
  # credentials/endpoint change only.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: circle
      MINIO_ROOT_PASSWORD: circlecircle
    ports: ["59000:9000", "59001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 circle circlecircle &&
      mc mb --ignore-existing local/circle-evidence &&
      mc anonymous set none local/circle-evidence &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ./docker/php
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes: ["./api:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      PHP_CLI_SERVER_WORKERS: 4

  worker:
    build:
      context: ./docker/php
    working_dir: /app
    command: php artisan queue:work --queue=media,agents,default --tries=3 --timeout=900
    volumes: ["./api:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  # The Astro front end. Runs the dev server so the whole stack comes up with a
  # single command; `npm run build && node dist/server/entry.mjs` is the
  # production shape.
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports: ["4321:4321"]
    environment:
      # Signed by the API against the host the browser will call.
      PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [api]

  scheduler:
    build:
      context: ./docker/php
    working_dir: /app
    command: php artisan schedule:work
    volumes: ["./api:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
  web_node_modules:
