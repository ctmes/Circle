name: circle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circle
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: circle
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circle -d circle"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible private object storage. Stands in for Cloudflare R2 in dev;
  # the app talks to it through the standard S3 driver, so production is a
  # credentials/endpoint change only.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: circle
      MINIO_ROOT_PASSWORD: circlecircle
    # Published below the ephemeral range on purpose. These were 59000/59001,
    # which land inside the port block Windows reserves for the Hyper-V NAT
    # (58826-59645 here) — Docker cannot bind them, MinIO never starts, and
    # because the API waits on its health check the whole stack stays down with
    # an error that names a socket rather than a reserved range. Anything under
    # 49152 is outside what Windows hands out dynamically, so 19000/19001 stay
    # bindable across reboots while still reading as MinIO's own 9000/9001.
    ports: ["19000:9000", "19001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 circle circlecircle &&
      mc mb --ignore-existing local/circle-evidence &&
      mc anonymous set none local/circle-evidence &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ./docker/php
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./api:/app
      # Keeping vendor/ off the Windows bind mount. Reading it through the
      # host filesystem measured ~1200x slower than a container-local path,
      # which is what made every API request cost 0.1-1.9s instead of 85ms.
      # Populate it with: docker compose run --rm api composer install
      - api_vendor:/app/vendor
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      PHP_CLI_SERVER_WORKERS: 4

  # Horizon supervises one worker pool per queue (config/horizon.php), so a
  # long transcode on `media` no longer holds up the password reset sitting
  # behind it on `default`. Dashboard at http://localhost:8000/horizon.
  worker:
    build:
      context: ./docker/php
    working_dir: /app
    command: php artisan horizon
    # Horizon answers SIGTERM by telling its supervisors to finish the job in
    # hand before exiting. Compose's default 10s would SIGKILL mid-transcode.
    stop_grace_period: 60s
    volumes:
      - ./api:/app
      # Keeping vendor/ off the Windows bind mount. Reading it through the
      # host filesystem measured ~1200x slower than a container-local path,
      # which is what made every API request cost 0.1-1.9s instead of 85ms.
      # Populate it with: docker compose run --rm api composer install
      - api_vendor:/app/vendor
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  # The Astro front end. Runs the dev server so the whole stack comes up with a
  # single command; `npm run build && node dist/server/entry.mjs` is the
  # production shape.
  web:
    image: node:24-alpine
    working_dir: /app
    # .astro/dev.json holds the dev server's PID and lives on the bind mount,
    # so a stopped container leaves it behind and the next start refuses with
    # "Another astro dev server is already running". Nothing in a fresh
    # container can be the process it names, so the stale lock just goes.
    # (`astro dev --force` is not the fix: it SIGTERMs that PID, which in a
    # new container is this very process.)
    command: sh -c "rm -f /app/.astro/dev.json && npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports: ["4321:4321"]
    environment:
      # Signed by the API against the host the browser will call.
      PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [api]

  scheduler:
    build:
      context: ./docker/php
    working_dir: /app
    command: php artisan schedule:work
    volumes:
      - ./api:/app
      # Keeping vendor/ off the Windows bind mount. Reading it through the
      # host filesystem measured ~1200x slower than a container-local path,
      # which is what made every API request cost 0.1-1.9s instead of 85ms.
      # Populate it with: docker compose run --rm api composer install
      - api_vendor:/app/vendor
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
  web_node_modules:
  api_vendor:
